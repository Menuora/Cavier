<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="">

    <link rel="icon" href="img/core-img/favicon.ico">

<body>
    <header class="header_area sticky" id="header">
        <div class="container h-100">
            <div class="row h-100">
                <div class="col-12 h-100">
                    <nav class="h-100 navbar navbar-expand-lg align-items-center">
                        <a class="navbar-brand" href="index.html" data-hotel-name>caviar</a>
                        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#caviarNav" aria-controls="caviarNav" aria-expanded="false" aria-label="Toggle navigation"><span class="fa fa-bars"></span></button>
                        <div class="collapse navbar-collapse" id="caviarNav">
                            <ul class="navbar-nav ml-auto">
                                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                                <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                                <li class="nav-item active"><a class="nav-link" href="images.html">Images</a></li>
                                <li class="nav-item"><a class="nav-link" href="index.html#reservation">Book Table</a></li>
                                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                            </ul>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <div class="breadcumb-area bg-img bg-overlay" data-bg-setting="imagesHeaderImage" style="background-image: url(img/bg-img/hero-2.jpg)">
        <div class="container h-100">
            <div class="row h-100 align-items-center">
                <div class="col-12">
                    <div class="breadcumb-content">
                        <h2>Menu Images</h2>
                        <a href="index.html#reservation" class="btn caviar-btn"><span></span> Book Table</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section class="caviar-dish-menu section-padding-150">
        <div class="container">
            <div class="row">
                <div class="col-12 menu-heading">
                    <div class="section-heading text-center">
                        <h2>Full Menu</h2>
                    </div>
                </div>
            </div>
            <div class="public-image-grid" id="menuImages"></div>
            <div class="row">
                <div class="col-12 menu-heading mt-5">
                    <div class="section-heading text-center">
                        <h2>Items</h2>
                    </div>
                </div>
            </div>
            <div class="public-image-grid" id="itemImages"></div>
            <p class="form-message text-center" id="imagePageMessage"></p>
        </div>
    </section>

    <footer class="caviar-footer-area">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="footer-text">
                        <a href="#" class="navbar-brand" data-hotel-name>caviar</a>
                        <p data-opening-hours>Open daily: 10:00 AM - 11:00 PM</p>
                        <div class="footer-social">
                            <a href="#" data-social-facebook><i class="fa fa-facebook" aria-hidden="true"></i></a>
                            <a href="#" data-social-instagram><i class="fa fa-instagram" aria-hidden="true"></i></a>
                            <a href="#" data-social-twitter><i class="fa fa-twitter" aria-hidden="true"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script src="js/bootstrap/popper.min.js"></script>
    <script src="js/bootstrap/bootstrap.min.js"></script>
    <script src="js/others/plugins.js"></script>
    <script src="js/active.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/env.js"></script>
    <script src="js/app.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/images.js"></script>
